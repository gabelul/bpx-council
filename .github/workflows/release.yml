name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Force publish to npm"
        required: false
        type: boolean
        default: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: bpx-council
          include-component-in-tag: false
          bump-minor-pre-major: true

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ contains(needs.release-please.outputs.paths_released, '.') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: # OIDC trusted publishing — no token needed
